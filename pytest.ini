[pytest]
pythonpath=.
testpaths = 
        tests/integration
        tests/UI
filterwarnings = ignore::pytest.PytestRemovedIn10Warning

addopts = --alluredir result
        --clean-alluredir
        --log-disable asyncio
        --slowmo 100

log_cli_level = INFO

log_file = logs/run.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_file_mode = w

markers= new
    auth
    smoke
    ui
    api